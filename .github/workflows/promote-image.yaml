name: Promote Image

on:
  workflow_call:
    inputs:
      env-params-file:
        description: Path to the Helm Values file
        required: true
        type: string
      origin-image-tag:
        description: Origin Image Tag for promotion
        required: true
        type: string
      new-image-tag:
        description: New Image tag after promotion
        required: true
        type: string


permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ENV_PARAMS_FILE: ${{ inputs.env-params-file }}
  ORIGIN_IMAGE_TAG: ${{ inputs.origin-image-tag }}
  NEW_IMAGE_TAG: ${{ inputs.new-image-tag }}

jobs:
  publish:
    name: Publish Image Metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4.48.2

      - name: Load configuration
        run: |
          echo "ECR_REPOSITORY_FULL_NAME=$(yq -r '.projectName' $ENV_PARAMS_FILE)/$(yq -r '.environment' $ENV_PARAMS_FILE)/$(yq -r '.serviceName' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"
          echo "GIT_IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Promote ECR image tag
        shell: bash
        run: |
          set -euo pipefail

          REPOSITORY="$ECR_REPOSITORY_FULL_NAME"
          ORIGIN_TAG="$ORIGIN_IMAGE_TAG"
          TARGET_TAG="$NEW_IMAGE_TAG"

          # Resolve the special literal "git-sha".
          if [[ "$ORIGIN_TAG" == "git-sha" ]]; then
            ORIGIN_TAG="$GIT_IMAGE_TAG"
          fi

          echo "Repository: $REPOSITORY"
          echo "Origin tag: $ORIGIN_TAG"
          echo "Target tag: $TARGET_TAG"

          # Check whether a tag exists in the repository.
          tag_exists() {
            aws ecr describe-images \
              --repository-name "$REPOSITORY" \
              --image-ids "imageTag=$1" \
              --region "$AWS_REGION" \
              >/dev/null 2>&1
          }

          # Copy an image manifest to another tag in the same repository.
          # Image layers are not uploaded again.
          copy_tag() {
            local source_tag="$1"
            local target_tag="$2"
            local manifest_file
            local media_type

            manifest_file=$(mktemp)
            trap 'rm -f "$manifest_file"' RETURN

            # Retrieve the manifest without adding an extra newline.
            aws ecr batch-get-image \
              --repository-name "$REPOSITORY" \
              --image-ids "imageTag=$source_tag" \
              --region "$AWS_REGION" \
              --output json |
              jq -j '.images[0].imageManifest' > "$manifest_file"

            # Retrieve the manifest media type.
            media_type=$(aws ecr batch-get-image \
              --repository-name "$REPOSITORY" \
              --image-ids "imageTag=$source_tag" \
              --region "$AWS_REGION" \
              --query 'images[0].imageManifestMediaType' \
              --output text)

            aws ecr put-image \
              --repository-name "$REPOSITORY" \
              --image-tag "$target_tag" \
              --image-manifest "file://$manifest_file" \
              --image-manifest-media-type "$media_type" \
              --region "$AWS_REGION"

            echo "Copied $source_tag -> $target_tag"
          }

          # Delete only the specified tag.
          delete_tag() {
            local tag="$1"

            aws ecr batch-delete-image \
              --repository-name "$REPOSITORY" \
              --image-ids "imageTag=$tag" \
              --region "$AWS_REGION" \
              --output json |
              jq -e '
                ((.failures // []) | length) == 0
              ' >/dev/null

            echo "Deleted tag: $tag"
          }

          # Special handling: preserve the previous production release.
          if [[ "$TARGET_TAG" == "prod-deployed" ]] &&
             tag_exists "prod-deployed"; then

            echo "Preserving the current production deployment."

            # Remove the previous rollback pointer, if present.
            if tag_exists "prod-previous"; then
              delete_tag "prod-previous"
            fi

            # Save the current production image under prod-previous.
            copy_tag "prod-deployed" "prod-previous"
          fi

          # Remove the destination tag before reusing it.
          # For prod-deployed, this happens only AFTER saving the old
          # deployment as prod-previous.
          if tag_exists "$TARGET_TAG"; then
            delete_tag "$TARGET_TAG"
          fi
          
          # Get digest before copying
          SOURCE_DIGEST=$(aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids "imageTag=$ORIGIN_TAG" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          # Assign the destination tag to the origin image
          copy_tag "$ORIGIN_TAG" "$TARGET_TAG"

          # Get digest after copying
          TARGET_DIGEST=$(aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids "imageTag=$TARGET_TAG" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          # Verify the digest remains unchanged
          if [[ "$TARGET_DIGEST" != "$SOURCE_DIGEST" ]]; then
            echo "::error::Digest integrity check failed. Digest changed after copying."
            exit 1
          else
            echo "Digest Integiry Check Passed!"
            
            IMAGE_DIGEST=$TARGET_DIGEST
            IMAGE_URI="${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY_FULL_NAME@$IMAGE_DIGEST"
            
            echo "IMAGE_DIGEST=${IMAGE_DIGEST}" >> "$GITHUB_ENV"
            echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          fi

          # Preserve the original Git SHA tag permanently.
          if [[ "$ORIGIN_TAG" != "$GIT_IMAGE_TAG" ]]; then
            delete_tag "$ORIGIN_TAG"
          else
            echo "Keeping the original Git SHA tag: $GIT_IMAGE_TAG"
          fi

          echo "Promotion completed: $TARGET_TAG"

      - name: Add publish summary
        run: |
          {
            echo "## Image Promotion"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Service | $SERVICE_NAME |"
            echo "| ECR repository | $ECR_REPOSITORY_FULL_NAME |"
            echo "| Starting Image tag | $IMAGE_TAG |"
            echo "| Promoted Image tag | $IMAGE_TAG |"
            echo "| Image digest | $IMAGE_DIGEST |"
            echo "| Image URI | $IMAGE_URI |"
            echo "| Security scan | Passed |"
          } >> "$GITHUB_STEP_SUMMARY"
