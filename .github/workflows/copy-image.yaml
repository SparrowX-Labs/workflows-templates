name: Copy Image

on:
  workflow_call:
    inputs:
      source-image-tag:
        description: Source Image Tag To Copy
        required: false
        type: string
        default: "dev-deployed"

      target-image-tag:
        description: Target Image Tag After Copied
        required: false
        type: string
        default: "prod-candidate"

      source-env-params-file:
        description: Path to Helm Values file for the source environment
        required: true
        type: string

      target-env-params-file:
        description: Path to Helm Values file for the target environment
        required: true
        type: string

    
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  SOURCE_ENV_PARAMS_FILE: ${{ inputs.source-env-params-file }}
  TARGET_ENV_PARAMS_FILE: ${{ inputs.target-env-params-file }}
  SOURCE_IMAGE_TAG: ${{ inputs.source-image-tag }}
  TARGET_IMAGE_TAG: ${{ inputs.target-image-tag }}

jobs:
  copy-image:
    name: Copy Image to Target ECR
    runs-on: ubuntu-latest

    steps:

      - name: Checkout application
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4.48.2

      - name: Load ECR repositories
        run: |
          SOURCE_ECR_REPOSITORY="$(
            yq -r '.projectName' "$SOURCE_ENV_PARAMS_FILE"
          )/$(
            yq -r '.environment' "$SOURCE_ENV_PARAMS_FILE"
          )"/$(
            yq -r '.serviceName' "$SOURCE_ENV_PARAMS_FILE"
          )"

          TARGET_ECR_REPOSITORY="$(
            yq -r '.projectName' "$TARGET_ENV_PARAMS_FILE"
          )/$(
            yq -r '.environment' "$TARGET_ENV_PARAMS_FILE"
          )"/$(
            yq -r '.serviceName' "$TARGET_ENV_PARAMS_FILE"
          )"

          echo "SOURCE_ECR_REPOSITORY: '$SOURCE_ECR_REPOSITORY'"
          echo "TARGET_ECR_REPOSITORY: '$TARGET_ECR_REPOSITORY'"

          if [ -z "$SOURCE_ECR_REPOSITORY" ] || [ "$SOURCE_ECR_REPOSITORY" = "null/null" ]; then
            echo "ERROR: Source ECR repository could not be resolved."
            exit 1
          fi

          if [ -z "$TARGET_ECR_REPOSITORY" ] || [ "$TARGET_ECR_REPOSITORY" = "null/null" ]; then
            echo "ERROR: Target ECR repository could not be resolved."
            exit 1
          fi

          ECR_REGISTRY="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          echo "SOURCE_ECR_REPOSITORY=$SOURCE_ECR_REPOSITORY" >> "$GITHUB_ENV"
          echo "TARGET_ECR_REPOSITORY=$TARGET_ECR_REPOSITORY" >> "$GITHUB_ENV"
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure target repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names "$TARGET_ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            > /dev/null

          echo "Target ECR repository exists."

      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

          skopeo --version


      - name: Install ORAS
        uses: oras-project/setup-oras@v2
        with:
          version: 1.3.4

      - name: Verify ORAS
        run: oras version

      - name: Login to ECR
        run: |
          ECR_PASSWORD="$(aws ecr get-login-password --region "$AWS_REGION")"

          # Skopeo and ORAS use different credential stores by default.
          printf '%s' "$ECR_PASSWORD" |
            skopeo login \
              --username AWS \
              --password-stdin \
              "$ECR_REGISTRY"

          printf '%s' "$ECR_PASSWORD" |
            oras login \
              --username AWS \
              --password-stdin \
              "$ECR_REGISTRY"

      - name: Resolve Source Image Tag
        run: |
          set -euo pipefail

          IMAGE_DETAILS=$(aws ecr describe-images \
            --repository-name "$SOURCE_ECR_REPOSITORY" \
            --image-ids "imageTag=$SOURCE_IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0]' \
            --output json)

          SOURCE_IMAGE_DIGEST=$(jq -r '.imageDigest // empty' <<< "$IMAGE_DETAILS")
          GIT_SHA_IMAGE_TAG=$(jq -r --arg source_tag "$SOURCE_IMAGE_TAG" \
            '.imageTags[]? | select(. != $source_tag and test("^[0-9a-fA-F]{40}$"))' \
            <<< "$IMAGE_DETAILS" | head -n 1)

          if [[ -z "$SOURCE_IMAGE_DIGEST" || "$SOURCE_IMAGE_DIGEST" == "None" ]]; then
            echo "::error::Could not resolve source image tag: $SOURCE_IMAGE_TAG"
            exit 1
          fi

          if [[ -z "$GIT_SHA_IMAGE_TAG" || "$GIT_SHA_IMAGE_TAG" == "None" ]]; then
            echo "::error::No Git SHA tag found for source image digest $SOURCE_IMAGE_DIGEST"
            exit 1
          fi

          echo "SOURCE_IMAGE_DIGEST=$SOURCE_IMAGE_DIGEST" >> "$GITHUB_ENV"
          echo "GIT_SHA_IMAGE_TAG=$GIT_SHA_IMAGE_TAG" >> "$GITHUB_ENV"

          echo "Source image digest: $SOURCE_IMAGE_DIGEST"
          echo "Original Git SHA tag: $GIT_SHA_IMAGE_TAG"

      - name: Check target image state
        id: target-state
        run: |
          set -euo pipefail

          image_digest() {
            local result
            if result="$(aws ecr describe-images \
              --repository-name "$TARGET_ECR_REPOSITORY" \
              --image-ids "$1" \
              --region "$AWS_REGION" \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>&1)"; then
              printf '%s' "$result"
            elif [[ "$result" == *ImageNotFoundException* ]]; then
              return 0
            else
              printf '%s\n' "$result" >&2
              return 1
            fi
          }

          source_digest="$(image_digest "imageDigest=$SOURCE_IMAGE_DIGEST")"
          git_sha_digest="$(image_digest "imageTag=$GIT_SHA_IMAGE_TAG")"
          target_tag_digest="$(image_digest "imageTag=$TARGET_IMAGE_TAG")"

          if [[ "$source_digest" == "$SOURCE_IMAGE_DIGEST" && \
                "$git_sha_digest" == "$SOURCE_IMAGE_DIGEST" ]]; then
            needed_action=skip
          elif [[ "$source_digest" == "$SOURCE_IMAGE_DIGEST" ]]; then
            needed_action=cleanup
          elif [[ -n "$git_sha_digest" ]]; then
            echo "::error::Target tag '$GIT_SHA_IMAGE_TAG' exists without source digest '$SOURCE_IMAGE_DIGEST'; target state is corrupted."
            exit 1
          else
            needed_action=proceed
          fi

          echo "needed-action=$needed_action" >> "$GITHUB_OUTPUT"
          echo "target-tag-matches=$([[ "$target_tag_digest" == "$SOURCE_IMAGE_DIGEST" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "target-tag-exists=$([[ -n "$target_tag_digest" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Target state: $needed_action"

      - name: Cleanup target image state
        id: cleanup
        if: steps.target-state.outputs.needed-action != 'skip' || steps.target-state.outputs.target-tag-matches != 'true'
        run: |
          set -euo pipefail

          if [ "${{ steps.target-state.outputs.needed-action }}" = cleanup ]; then
            echo "Corrupted target state; deleting the digest and its referrers."
            oras discover --format json "$ECR_REGISTRY/$TARGET_ECR_REPOSITORY@$SOURCE_IMAGE_DIGEST" |
              jq -r '.manifests[]?.digest // empty' |
              xargs -r -n1 oras manifest delete "$ECR_REGISTRY/$TARGET_ECR_REPOSITORY@" --force
            aws ecr batch-delete-image \
              --repository-name "$TARGET_ECR_REPOSITORY" \
              --image-ids "imageDigest=$SOURCE_IMAGE_DIGEST" \
              --region "$AWS_REGION" > /dev/null
            aws ecr batch-delete-image \
              --repository-name "$TARGET_ECR_REPOSITORY" \
              --image-ids "imageTag=$GIT_SHA_IMAGE_TAG" \
              --region "$AWS_REGION" > /dev/null
          fi

          if [ "${{ steps.target-state.outputs.target-tag-exists }}" = true ] && \
             [ "${{ steps.target-state.outputs.target-tag-matches }}" != true ]; then
            aws ecr batch-delete-image \
              --repository-name "$TARGET_ECR_REPOSITORY" \
              --image-ids "imageTag=$TARGET_IMAGE_TAG" \
              --region "$AWS_REGION" > /dev/null
          fi

          echo "cleanup=done" >> "$GITHUB_OUTPUT"

      - name: Copy image to target ECR
        if: >
          steps.target-state.outputs.needed-action == 'proceed' ||
          (
            steps.target-state.outputs.needed-action == 'cleanup' &&
            steps.cleanup.outputs.cleanup == 'done'
          )
        run: |
          set -euo pipefail

          SOURCE_IMAGE="docker://$ECR_REGISTRY/$SOURCE_ECR_REPOSITORY@$SOURCE_IMAGE_DIGEST"
          TARGET_IMAGE="docker://$ECR_REGISTRY/$TARGET_ECR_REPOSITORY:$GIT_SHA_IMAGE_TAG"

          echo "Copying image..."
          echo "Source: $SOURCE_ECR_REPOSITORY@$SOURCE_IMAGE_DIGEST"
          echo "Target: $TARGET_ECR_REPOSITORY:$GIT_SHA_IMAGE_TAG"

          skopeo copy \
            --all \
            "$SOURCE_IMAGE" \
            "$TARGET_IMAGE"

          echo "Image copied successfully."

      # Attach target-image-tag to the copied image
      - name: Add target tag to copied image
        if: steps.target-state.outputs.target-tag-matches != 'true'
        run: |
          set -euo pipefail

          IMAGE_MANIFEST=$(aws ecr batch-get-image \
            --repository-name "$TARGET_ECR_REPOSITORY" \
            --image-ids "imageTag=$GIT_SHA_IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'images[0].imageManifest' \
            --output text)

          IMAGE_MANIFEST_MEDIA_TYPE=$(aws ecr batch-get-image \
            --repository-name "$TARGET_ECR_REPOSITORY" \
            --image-ids "imageTag=$GIT_SHA_IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'images[0].imageManifestMediaType' \
            --output text)

          aws ecr put-image \
            --repository-name "$TARGET_ECR_REPOSITORY" \
            --image-tag "$TARGET_IMAGE_TAG" \
            --image-manifest "$IMAGE_MANIFEST" \
            --image-manifest-media-type "$IMAGE_MANIFEST_MEDIA_TYPE" \
            --region "$AWS_REGION"

          echo "Added target image tag to copied image."

      - name: Verify copied image
        run: |
          echo "Verifying copied image in target ECR..."

          TARGET_DIGEST="$(aws ecr describe-images \
            --repository-name "$TARGET_ECR_REPOSITORY" \
            --image-ids "imageTag=$TARGET_IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          if [ -z "$TARGET_DIGEST" ] || [ "$TARGET_DIGEST" = "None" ]; then
            echo "Target image tag '$TARGET_IMAGE_TAG' was not found after image copy."
            exit 1
          fi

          if [ "$TARGET_DIGEST" != "$SOURCE_IMAGE_DIGEST" ]; then
            echo "Target image digest does not match the expected source digest."
            echo "Expected: $SOURCE_IMAGE_DIGEST"
            echo "Target:   $TARGET_DIGEST"
            exit 1
          fi

          echo "TARGET_DIGEST=$TARGET_DIGEST" >> "$GITHUB_ENV"

          echo "Image copied successfully."

      - name: Check target image referrers
        id: referrers
        run: |
          set -euo pipefail

          TARGET_IMAGE="$ECR_REGISTRY/$TARGET_ECR_REPOSITORY@$TARGET_DIGEST"

          echo "Inspecting signature referrers for: $TARGET_IMAGE"

          DISCOVER_OUTPUT="$(oras discover --format json "$TARGET_IMAGE")"

          signature_exists=false
          attestation_exists=false
          signature_digest=""
          attestation_digest=""

          signature_digest="$(jq -r 'first(.manifests[]? | select(.artifactType == "application/vnd.dev.cosign.artifact.sig.v1+json") | .digest) // empty' <<< "$DISCOVER_OUTPUT")"
          attestation_digest="$(jq -r 'first(.manifests[]? | select(.artifactType == "application/vnd.dsse.envelope.v1+json") | .digest) // empty' <<< "$DISCOVER_OUTPUT")"

          [ -n "$signature_digest" ] && signature_exists=true
          [ -n "$attestation_digest" ] && attestation_exists=true

          echo "signature-exists=$signature_exists" >> "$GITHUB_OUTPUT"
          echo "attestation-exists=$attestation_exists" >> "$GITHUB_OUTPUT"
          echo "signature-digest=$signature_digest" >> "$GITHUB_OUTPUT"
          echo "attestation-digest=$attestation_digest" >> "$GITHUB_OUTPUT"

          echo "Target signature exists: $signature_exists"
          echo "Target SBOM attestation exists: $attestation_exists"

      - name: Cleanup incomplete target referrers
        if: steps.referrers.outputs.signature-exists != 'true' || steps.referrers.outputs.attestation-exists != 'true'
        run: |
          set -euo pipefail

          TARGET_REPOSITORY="$ECR_REGISTRY/$TARGET_ECR_REPOSITORY"

          # A partial referrer set is invalid for this promotion. Remove the
          # remaining referrers so the recursive copy can recreate both.
          for referrer_digest in \
            "${{ steps.referrers.outputs.signature-digest }}" \
            "${{ steps.referrers.outputs.attestation-digest }}"; do
            if [ -n "$referrer_digest" ]; then
              oras manifest delete "$TARGET_REPOSITORY@$referrer_digest" --force
            fi
          done

      - name: Copy image referrers
        if: steps.referrers.outputs.signature-exists != 'true' || steps.referrers.outputs.attestation-exists != 'true'
        run: |
          set -euo pipefail

          SOURCE_IMAGE="$ECR_REGISTRY/$SOURCE_ECR_REPOSITORY@$SOURCE_IMAGE_DIGEST"
          TARGET_IMAGE="$ECR_REGISTRY/$TARGET_ECR_REPOSITORY@$TARGET_DIGEST"

          echo "Copying signature and SBOM attestation referrers..."
          oras cp "$SOURCE_IMAGE" "$TARGET_IMAGE" --recursive
          echo "Image referrers copied successfully."

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Verify target signature and attestation
        run: |
          set -euo pipefail

          TARGET_IMAGE="$ECR_REGISTRY/$TARGET_ECR_REPOSITORY@$TARGET_DIGEST"

          cosign verify "$TARGET_IMAGE" > /dev/null
          cosign verify-attestation \
            --type cyclonedx \
            "$TARGET_IMAGE" > /dev/null

          echo "Target signature and SBOM attestation verified successfully."

      - name: Add promotion summary
        if: always()
        run: |
          {
            echo "## ECR Image Promotion"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Source repository | \`$SOURCE_ECR_REPOSITORY\` |"
            echo "| Target repository | \`$TARGET_ECR_REPOSITORY\` |"
            echo "| Image tag | \`$SOURCE_IMAGE_TAG\` |"
            echo "| Image digest | \`$TARGET_DIGEST\` |"
            echo "| Result | \`${{ job.status }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
