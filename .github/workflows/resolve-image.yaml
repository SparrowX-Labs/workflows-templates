name: Resolve Image

on:
  workflow_call:
    inputs:
      ssm-parameter-path:
        description: SSM Parameter Store to retrieve image metadata from
        required: true
        type: string
      env-params-file:
        description: Path to the ECS parameters file
        required: true
        type: string

    outputs:
      image-tag:
        description: Validated image tag
        value: ${{ jobs.resolve-image.outputs.image-tag }}
      image-digest:
        description: Validated image digest
        value: ${{ jobs.resolve-image.outputs.image-digest }}
      image-uri:
        description: Full immutable image URI
        value: ${{ jobs.resolve-image.outputs.image-uri }}

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ENV_PARAMS_FILE: ${{ inputs.env-params-file }}

jobs:
  resolve-image:
    name: Resolve and Validate Image
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.image-metadata.outputs.image-tag }}
      image-digest: ${{ steps.image-metadata.outputs.image-digest }}
      image-uri: ${{ steps.image-metadata.outputs.image-uri }}

    steps:

      - name: Checkout application
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4.48.2

      - name: Load image configuration
        run: |
          echo "ECR_REPOSITORY_FULL_NAME=$(yq -r '.image.nameSpace' $ENV_PARAMS_FILE)/$(yq -r '.image.repository' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Retrieve image metadata
        id: image-metadata
        run: |
          echo "Retrieving image metadata from: ${{ inputs.ssm-parameter-path }}"

          IMAGE_METADATA="$(
            aws ssm get-parameter \
              --name "${{ inputs.ssm-parameter-path }}" \
              --region "$AWS_REGION" \
              --query 'Parameter.Value' \
              --output text
          )"

          if [ -z "$IMAGE_METADATA" ] || [ "$IMAGE_METADATA" = "None" ]; then
            echo "ERROR: No image metadata found in Parameter Store."
            exit 1
          fi

          IMAGE_TAG="$(echo "$IMAGE_METADATA" | jq -r '.image.tag')"
          IMAGE_DIGEST="$(echo "$IMAGE_METADATA" | jq -r '.image.digest')"
          IMAGE_URI="$(echo "$IMAGE_METADATA" | jq -r '.image.uri')"

          if [ -z "$IMAGE_TAG" ] || [ "$IMAGE_TAG" = "null" ]; then
            echo "ERROR: Image tag is missing from metadata."
            exit 1
          fi

          if [ -z "$IMAGE_DIGEST" ] || [ "$IMAGE_DIGEST" = "null" ]; then
            echo "ERROR: Image digest is missing from metadata."
            exit 1
          fi

          echo "Image tag: $IMAGE_TAG"
          echo "Image digest: $IMAGE_DIGEST"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"

          echo "image-tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image-digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "image-uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Validate image metadata
        id: validate-image
        run: |
          echo "Validating image in ECR..."
          echo "Repository: $ECR_REPOSITORY_FULL_NAME"
          echo "Tag: $IMAGE_TAG"
          echo "Digest: $IMAGE_DIGEST"

          IMAGE_DETAILS="$(
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY_FULL_NAME" \
              --image-ids imageTag="$IMAGE_TAG" \
              --region "$AWS_REGION" \
              --query 'imageDetails[0]' \
              --output json
          )"

          if [ "$IMAGE_DETAILS" = "null" ]; then
            echo "ERROR: Image with tag '$IMAGE_TAG' does not exist in ECR."
            exit 1
          fi

          ECR_DIGEST="$(echo "$IMAGE_DETAILS" | jq -r '.imageDigest')"

          if [ "$ECR_DIGEST" != "$IMAGE_DIGEST" ]; then
            echo "ERROR: Image digest mismatch."
            echo "Expected: $IMAGE_DIGEST"
            echo "Found:    $ECR_DIGEST"
            exit 1
          fi

          echo "Image validation successful."
          echo "Image tag: $IMAGE_TAG"
          echo "Image digest: $IMAGE_DIGEST"

      - name: Add resolve image summary
        if: always()
        run: |
          IMAGE_TAG="${IMAGE_TAG:-Unavailable}"
          IMAGE_DIGEST="${IMAGE_DIGEST:-Unavailable}"
          REPOSITORY="${ECR_REPOSITORY_FULL_NAME:-Unavailable}"

          if [ "${{ steps.validate-image.outcome }}" = "success" ]; then
            VALIDATION="Passed"
          else
            VALIDATION="Failed"
          fi

          {
            echo "## Resolve Image"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Parameter | \`${{ inputs.ssm-parameter-path }}\` |"
            echo "| ECR repository | \`$REPOSITORY\` |"
            echo "| Image tag | \`$IMAGE_TAG\` |"
            echo "| Image digest | \`$IMAGE_DIGEST\` |"
            echo "| ECR validation | **$VALIDATION** |"
          } >> "$GITHUB_STEP_SUMMARY"