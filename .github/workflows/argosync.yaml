
name: Argo CD Sync

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: string

      env-params-file:
        description: Helm values file for the target environment
        required: true
        type: string

      image-tag:
        description: Image tag to deploy
        required: true
        type: string

    secrets:
      ARGOCD_SERVER:
        required: true
      ARGOCD_AUTH_TOKEN:
        required: true

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ENV_PARAMS_FILE: ${{ inputs.env-params-file }}

jobs:
  argosync:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      APP_NAME: ${{ github.event.repository.name }}
      ENVIRONMENT: ${{ inputs.environment }}
      ENV_PARAMS_FILE: ${{ inputs.env-params-file }}
      IMAGE_TAG: ${{ inputs.image-tag }}

    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          case "$IMAGE_TAG" in
            dev-candidate|dev-deployed|prod-candidate|prod-deployed|prod-previous)
              ;;
            *)
              echo "::error::Invalid image tag: $IMAGE_TAG"
              exit 1
              ;;
          esac

          echo "Application: $APP_NAME"
          echo "Environment: $ENVIRONMENT"
          echo "Values file: $ENV_PARAMS_FILE"
          echo "Image tag: $IMAGE_TAG"

      - name: Install yq
        uses: mikefarah/yq@v4.48.2

      - name: Load image configuration
        run: |
          echo "ECR_REPOSITORY_FULL_NAME=$(yq -r '.projectName' $ENV_PARAMS_FILE)/$(yq -r '.environment' $ENV_PARAMS_FILE)/$(yq -r '.serviceName' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"
          echo "ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_ENV"
          
      - name: Verify Argo CD access
        uses: clowdhaus/argo-cd-action@v4.2.0 
        with:
          version: 2.14.11
          command: app get ${{ env.APP_NAME }}
          options: >-
            --server ${{ secrets.ARGOCD_SERVER }}
            --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }}
            --grpc-web

      - name: Set image tag
        uses: clowdhaus/argo-cd-action@v4.2.0 
        with:
          version: 2.14.11
          command: app set ${{ env.APP_NAME }}
          options: >-
            --server ${{ secrets.ARGOCD_SERVER }}
            --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }}
            --grpc-web
            --values ${{ env.ENV_PARAMS_FILE }}
            --helm-set-string image.repository=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_FULL_NAME }}
            --helm-set-string image.tag=${{ env.IMAGE_TAG }}


      - name: Sync application
        uses: clowdhaus/argo-cd-action@v4.2.0 
        with:
          version: 2.14.11
          command: app sync ${{ env.APP_NAME }}
          options: >-
            --server ${{ secrets.ARGOCD_SERVER }}
            --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }}
            --grpc-web
            --timeout 600

      - name: Wait for application health
        uses: clowdhaus/argo-cd-action@v4.2.0
        with:
          version: 2.14.11
          command: app wait ${{ env.APP_NAME }}
          options: >-
            --server ${{ secrets.ARGOCD_SERVER }}
            --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }}
            --grpc-web
            --sync
            --health
            --timeout 600