name: Copy Image

on:
  workflow_call:
    inputs:
      image-tag:
        description: Image tag to promote
        required: true
        type: string

      image-digest:
        description: Expected image digest
        required: true
        type: string

      source-env-params-file:
        description: ECS parameters file for the source environment
        required: true
        type: string

      target-env-params-file:
        description: ECS parameters file for the target environment
        required: true
        type: string
    # Outputs refer to image values in the Prod ECR repo after copying
    # Image tag is the same, it's added to the outputs to be used by consecutive jobs
    outputs:
      image-tag:
        description: Image tag
        value: ${{ jobs.copy-image.outputs.image-tag }}
      image-uri:
        description: Full immutable image URI
        value: ${{ jobs.copy-image.outputs.image-uri }}

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  SOURCE_ENV_PARAMS_FILE: ${{ inputs.source-env-params-file }}
  TARGET_ENV_PARAMS_FILE: ${{ inputs.target-env-params-file }}
  IMAGE_TAG: ${{ inputs.image-tag }}
  IMAGE_DIGEST: ${{ inputs.image-digest }}

jobs:
  copy-image:
    name: Copy Image to Target ECR
    runs-on: ubuntu-latest

    
    outputs:
      image-tag: ${{ steps.publish-output.outputs.image-tag }}
      image-uri: ${{ steps.publish-output.outputs.image-uri }}

    steps:

      - name: Checkout application
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4.48.2

      - name: Load ECR repositories
        run: |
          SOURCE_ECR_REPOSITORY="$(
            yq -r '.image.nameSpace' "$SOURCE_ENV_PARAMS_FILE"
          )/$(
            yq -r '.image.repository' "$SOURCE_ENV_PARAMS_FILE"
          )"

          TARGET_ECR_REPOSITORY="$(
            yq -r '.image.nameSpace' "$TARGET_ENV_PARAMS_FILE"
          )/$(
            yq -r '.image.repository' "$TARGET_ENV_PARAMS_FILE"
          )"

          if [ -z "$SOURCE_ECR_REPOSITORY" ] || [ "$SOURCE_ECR_REPOSITORY" = "null/null" ]; then
            echo "ERROR: Source ECR repository could not be resolved."
            exit 1
          fi

          if [ -z "$TARGET_ECR_REPOSITORY" ] || [ "$TARGET_ECR_REPOSITORY" = "null/null" ]; then
            echo "ERROR: Target ECR repository could not be resolved."
            exit 1
          fi

          echo "SOURCE_ECR_REPOSITORY=$SOURCE_ECR_REPOSITORY" >> "$GITHUB_ENV"
          echo "TARGET_ECR_REPOSITORY=$TARGET_ECR_REPOSITORY" >> "$GITHUB_ENV"

          echo "Source repository: $SOURCE_ECR_REPOSITORY"
          echo "Target repository: $TARGET_ECR_REPOSITORY"
          echo "Image tag: $IMAGE_TAG"
          echo "Expected digest: $IMAGE_DIGEST"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure target repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names "$TARGET_ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            > /dev/null

          echo "Target ECR repository exists."

      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

          skopeo --version


      - name: Install ORAS
        uses: oras-project/setup-oras@v2
        with:
          version: 1.3.4

      - name: Verify ORAS
        run: oras version

      - name: Login to ECR
        run: |
          ECR_REGISTRY="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          ECR_PASSWORD="$(aws ecr get-login-password --region "$AWS_REGION")"

          # Skopeo and ORAS use different credential stores by default.
          printf '%s' "$ECR_PASSWORD" |
            skopeo login \
              --username AWS \
              --password-stdin \
              "$ECR_REGISTRY"

          printf '%s' "$ECR_PASSWORD" |
            oras login \
              --username AWS \
              --password-stdin \
              "$ECR_REGISTRY"

      - name: Check whether image exists in ECR
        id: image
        run: |
          set +e
          describe_output=$(aws ecr describe-images \
            --repository-name "$TARGET_ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --region "$AWS_REGION" 2>&1)
          describe_status=$?
          set -e

          if [ "$describe_status" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists."
          elif grep -q "ImageNotFoundException" <<< "$describe_output"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image does not exist; it will be copied."
          else
            echo "$describe_output"
            exit "$describe_status"
          fi

      - name: Copy image to target ECR
        id: copy
        if: steps.image.outputs.exists != 'true'
        run: |
          ECR_REGISTRY="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          SOURCE_IMAGE="docker://$ECR_REGISTRY/$SOURCE_ECR_REPOSITORY@$IMAGE_DIGEST"
          TARGET_IMAGE="docker://$ECR_REGISTRY/$TARGET_ECR_REPOSITORY:$IMAGE_TAG"

          echo "Copying image..."
          echo "Source: $SOURCE_ECR_REPOSITORY@$IMAGE_DIGEST"
          echo "Target: $TARGET_ECR_REPOSITORY:$IMAGE_TAG"

          skopeo copy \
            --all \
            "$SOURCE_IMAGE" \
            "$TARGET_IMAGE"

          echo "Image copied successfully."

          TARGET_IMAGE_URI="$ECR_REGISTRY/$TARGET_ECR_REPOSITORY@$IMAGE_DIGEST"
          echo "image-tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "target-image-uri=$TARGET_IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Check target image signature
        id: signature
        run: |
          ECR_REGISTRY="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          TARGET_DIGEST="$(aws ecr describe-images \
            --repository-name "$TARGET_ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          if [ -z "$TARGET_DIGEST" ] || [ "$TARGET_DIGEST" = "None" ]; then
            echo "Target image tag '$IMAGE_TAG' was not found after image copy."
            exit 1
          fi

          if [ "$TARGET_DIGEST" != "$IMAGE_DIGEST" ]; then
            echo "Target image digest does not match the expected source digest."
            echo "Expected: $IMAGE_DIGEST"
            echo "Target:   $TARGET_DIGEST"
            exit 1
          fi

          TARGET_IMAGE="$ECR_REGISTRY/$TARGET_ECR_REPOSITORY@$TARGET_DIGEST"
          echo "Inspecting signature referrers for: $TARGET_IMAGE"

          DISCOVER_OUTPUT="$(oras discover \
            --format json \
            "$TARGET_IMAGE")"

          if jq -e \
            'any(.manifests[]?; .artifactType == "application/vnd.dev.cosign.artifact.sig.v1+json")' \
            <<< "$DISCOVER_OUTPUT" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Cosign signature already exists; skipping signature copy."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Cosign signature is missing; it will be copied."
          fi

      - name: Copy image signature
        if: steps.signature.outputs.exists != 'true'
        run: |
          ECR_REGISTRY="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          SOURCE_IMAGE="$ECR_REGISTRY/$SOURCE_ECR_REPOSITORY@$IMAGE_DIGEST"
          TARGET_IMAGE="$ECR_REGISTRY/$TARGET_ECR_REPOSITORY@$IMAGE_DIGEST"

          echo "Copying Cosign signature..."
          echo "Source: $SOURCE_IMAGE"
          echo "Target: $TARGET_IMAGE"

          oras discover "$SOURCE_IMAGE"

          # Copy the Cosign signature/referrers from source to target.
          oras cp \
            "$SOURCE_IMAGE" \
            "$TARGET_IMAGE" \
            --recursive

          echo "Cosign signature copied successfully."
          
      - name: Verify promoted image
        id: verify
        run: |
          echo "Verifying image in target ECR..."

          TARGET_IMAGE_DIGEST="$(
            aws ecr describe-images \
              --repository-name "$TARGET_ECR_REPOSITORY" \
              --image-ids imageTag="$IMAGE_TAG" \
              --region "$AWS_REGION" \
              --query 'imageDetails[0].imageDigest' \
              --output text
          )"

          echo "Expected digest: $IMAGE_DIGEST"
          echo "Target digest:   $TARGET_IMAGE_DIGEST"

          if [ "$TARGET_IMAGE_DIGEST" != "$IMAGE_DIGEST" ]; then
            echo "ERROR: Target image digest does not match source image digest."
            exit 1
          fi

          echo "Image promotion verified successfully."

      - name: Publish copied image outputs
        id: publish-output
        run: |
          ECR_REGISTRY="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "image-tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image-uri=$ECR_REGISTRY/$TARGET_ECR_REPOSITORY@$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Add promotion summary
        if: always()
        run: |
          {
            echo "## ECR Image Promotion"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Source repository | \`$SOURCE_ECR_REPOSITORY\` |"
            echo "| Target repository | \`$TARGET_ECR_REPOSITORY\` |"
            echo "| Image tag | \`$IMAGE_TAG\` |"
            echo "| Image digest | \`$IMAGE_DIGEST\` |"
            echo "| Image existed before copy | \`$IMAGE_EXISTS\` |"
            echo "| Result | \`${{ job.status }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
