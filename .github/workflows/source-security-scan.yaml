name: Source Security Scan

on:
  workflow_call:
    inputs:
      runtime:
        description: Application runtime to scan
        required: true
        type: string
    outputs:
      artifact-name:
        description: Source security report artifact
        value: ${{ jobs.source-security-scan.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  source-security-scan:
    name: Source Security Scan
    runs-on: ubuntu-latest

    outputs:
      artifact-name: ${{ steps.artifact-name.outputs.artifact-name }}

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Prepare report directory
        run: mkdir -p source-security-reports

      - name: Scan repository for secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: json
          output: source-security-reports/trivy-secret-results.json
          exit-code: '0'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Scan source code with Semgrep
        continue-on-error: true
        run: |
          case "${{ inputs.runtime }}" in
            python)
              CONFIGURATION="Python/OWASP/FastAPI/SQL"
              CONFIGS=(
                --config p/owasp-top-ten
                --config p/security-audit
                --config p/python
                --config p/fastapi
                --config p/sql-injection
              )
              ;;
            node)
              CONFIGURATION="React/TypeScript/JavaScript/OWASP"
              CONFIGS=(
                --config p/owasp-top-ten
                --config p/react
                --config p/typescript
                --config p/javascript
              )
              ;;
            *)
              echo "Unsupported runtime: ${{ inputs.runtime }}"
              echo "Supported runtimes: python, node"
              exit 2
              ;;
          esac

          echo "SAST_CONFIGURATION=$CONFIGURATION" >> "$GITHUB_ENV"
          semgrep scan \
            "${CONFIGS[@]}" \
            --metrics=off \
            --no-git-ignore \
            --exclude .cache \
            --exclude source-security-reports \
            --json \
            --verbose\
            --output source-security-reports/semgrep-results.json \
            . \
            tests/

      - name: Create source security report
        id: report
        if: always()
        run: |
          SECRET_STATUS=error
          SECRET_FINDINGS=0
          SAST_STATUS=error
          SAST_FINDINGS=0

          if [ -s source-security-reports/trivy-secret-results.json ] && \
            jq empty source-security-reports/trivy-secret-results.json; then
            SECRET_FINDINGS=$(jq '[.Results[]?.Secrets[]?] | length' \
              source-security-reports/trivy-secret-results.json)
            SECRET_STATUS=passed
            if [ "$SECRET_FINDINGS" -gt 0 ]; then
              SECRET_STATUS=findings
            fi
          fi

          if [ -s source-security-reports/semgrep-results.json ] && \
            jq empty source-security-reports/semgrep-results.json; then
            SAST_FINDINGS=$(jq '.results | length' \
              source-security-reports/semgrep-results.json)
            SAST_STATUS=passed
            if [ "$SAST_FINDINGS" -gt 0 ]; then
              SAST_STATUS=findings
            fi
          fi

          OVERALL_STATUS=passed
          if [ "$SECRET_STATUS" = error ] || [ "$SAST_STATUS" = error ]; then
            OVERALL_STATUS=error
          elif [ "$SECRET_STATUS" = findings ] || [ "$SAST_STATUS" = findings ]; then
            OVERALL_STATUS=findings
          fi

          jq -n \
            --arg status "$OVERALL_STATUS" \
            --arg secret_status "$SECRET_STATUS" \
            --argjson secret_findings "$SECRET_FINDINGS" \
            --arg sast_status "$SAST_STATUS" \
            --argjson sast_findings "$SAST_FINDINGS" \
            '{
              schemaVersion: 1,
              status: $status,
              secretScanning: {
                status: $secret_status,
                findings: $secret_findings,
                report: "trivy-secret-results.json"
              },
              sast: {
                status: $sast_status,
                findings: $sast_findings,
                report: "semgrep-results.json"
              }
            }' > source-security-reports/combined-source-security-scan-results.json

          {
            echo "## Source Security Scan"
            echo
            echo "| Control | Status | Findings |"
            echo "|---|---|---:|"
            echo "| Secret scanning | $SECRET_STATUS | $SECRET_FINDINGS |"
            echo "| SAST | $SAST_STATUS | $SAST_FINDINGS |"
            echo
            echo "Report artifact: source-security-${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$OVERALL_STATUS" = error ]; then
            exit 1
          fi

      - name: Upload source security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-security-${{ github.run_id }}
          path: |
            source-security-reports/combined-source-security-scan-results.json
            source-security-reports/trivy-secret-results.json
            source-security-reports/semgrep-results.json
          if-no-files-found: error

      - name: Set report artifact output
        id: artifact-name
        if: always()
        run: echo "artifact-name=source-security-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
