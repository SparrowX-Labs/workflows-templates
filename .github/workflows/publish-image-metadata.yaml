name: Publish Image Metadata

on:
  workflow_call:
    inputs:
      ssm-parameter-path:
        description: SSM Parameter Store path for image metadata
        required: true
        type: string
      env-params-file:
        description: Path to the ECS parameters file
        required: true
        type: string
      image-tag:
        description: Image tag to promote
        required: true
        type: string
      image-uri:
        description: Full immutable image URI; when omitted, it is derived from the resolved digest for legacy callers
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ENV_PARAMS_FILE: ${{ inputs.env-params-file }}
  IMAGE_TAG: ${{ inputs.image-tag }}
  INPUT_IMAGE_URI: ${{ inputs.image-uri }}

jobs:
  publish:
    name: Publish Image Metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4.48.2

      - name: Load configuration
        run: |
          echo "ENVIRONMENT_NAME=$(yq -r '.project.environment' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"
          echo "SERVICE_NAME=$(yq -r '.service.name' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY_FULL_NAME=$(yq -r '.image.nameSpace' $ENV_PARAMS_FILE)/$(yq -r '.image.repository' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"

          ECR_REGISTRY="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> "$GITHUB_ENV"


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image metadata
        run: |
          IMAGE_DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY_FULL_NAME" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [ -z "$IMAGE_DIGEST" ] || [ "$IMAGE_DIGEST" = "None" ]; then
            echo "Image not found in ECR."
            exit 1
          fi

          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"

          if [ -n "$INPUT_IMAGE_URI" ]; then
            EXPECTED_IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY_FULL_NAME@$IMAGE_DIGEST"
            if [ "$INPUT_IMAGE_URI" != "$EXPECTED_IMAGE_URI" ]; then
              echo "The supplied immutable image URI does not match the image tag's ECR digest."
              echo "Expected: $EXPECTED_IMAGE_URI"
              echo "Received: $INPUT_IMAGE_URI"
              exit 1
            fi
            echo "IMAGE_URI=$INPUT_IMAGE_URI" >> "$GITHUB_ENV"
          else
            echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY_FULL_NAME@$IMAGE_DIGEST" >> "$GITHUB_ENV"
          fi

      - name: Create image metadata
        run: |
          cat > image-metadata.json <<EOF
          {
            "service": "$SERVICE_NAME",
            "environment": "$ENVIRONMENT_NAME",
            "image": {
              "repository": "$ECR_REPOSITORY_FULL_NAME",
              "tag": "$IMAGE_TAG",
              "digest": "$IMAGE_DIGEST",
              "uri": "$IMAGE_URI"
            },
            "source": {
              "commit": "${{ github.sha }}",
              "repository": "${{ github.repository }}",
              "workflow": "${{ github.workflow }}",
              "runId": "${{ github.run_id }}"
            },
            "security": {
              "scanner": "trivy",
              "status": "passed"
            }
          }
          EOF

          cat image-metadata.json

      - name: Publish image metadata to Parameter Store
        run: |
          aws ssm put-parameter \
            --name "${{ inputs.ssm-parameter-path }}" \
            --type String \
            --value "$(cat image-metadata.json)" \
            --overwrite \
            --region "$AWS_REGION"

      - name: Add publish summary
        run: |
          {
            echo "## Image Metadata"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Service | $SERVICE_NAME |"
            echo "| ECR repository | \`$ECR_REPOSITORY_FULL_NAME\` |"
            echo "| Image tag | \`$IMAGE_TAG\` |"
            echo "| Image digest | \`$IMAGE_DIGEST\` |"
            echo "| Image URI | \`$IMAGE_URI\` |"
            echo "| Security scan | Passed |"
            echo "| SSM Parameter | \`${{ inputs.ssm-parameter-path }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
