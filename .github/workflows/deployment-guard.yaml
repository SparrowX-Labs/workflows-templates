name: Deployment Guard

on:
  workflow_call:
    inputs:
      env-params-file:
        description: Path to the application parameters file
        required: true
        type: string

      environment:
        description: Target environment
        required: true
        type: string

    outputs:
      deployment-enabled:
        description: Whether application deployment is allowed
        value: ${{ jobs.guard.outputs.deployment-enabled }}

permissions:
  contents: read

jobs:
  guard:
    name: Check Deployment State
    runs-on: ubuntu-latest

    env:
      INFRASTRUCTURE_REPOSITORY: SparrowX-ECS/ecs-infrastructure
      INFRASTRUCTURE_REPOSITORY_PATH: ecs-infrastructure
      INFRASTRUCTURE_PARAMETERS_FILE: environments/${{ inputs.environment }}/${{ inputs.environment }}-parameters.yaml
    
    outputs:
      deployment-enabled: ${{ steps.guard.outputs.deployment-enabled }}

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRASTRUCTURE_REPOSITORY }}
          path: ${{ env.INFRASTRUCTURE_REPOSITORY_PATH }}

      - name: Install yq
        uses: mikefarah/yq@v4.48.2

      - name: Check deployment state
        id: guard
        env:
          APP_PARAMETERS_FILE: ${{ inputs.env-params-file }}
          INFRA_PARAMETERS_FILE: ${{ env.INFRASTRUCTURE_REPOSITORY_PATH }}/${{ env.INFRASTRUCTURE_PARAMETERS_FILE }}
        run: |
          set -euo pipefail

          APP_STACK_STATE=$(yq -r '.appStack.state' "$APP_PARAMETERS_FILE")
          ROOT_STACK_STATE=$(yq -r '.RootStack.State' "$INFRA_PARAMETERS_FILE")

          echo "AppStack.State: $APP_STACK_STATE"
          echo "RootStack.State: $ROOT_STACK_STATE"

          echo "app-stack-state=$APP_STACK_STATE" >> "$GITHUB_OUTPUT"
          echo "root-stack-state=$ROOT_STACK_STATE" >> "$GITHUB_OUTPUT"

          if [[ "$APP_STACK_STATE" != "enabled" &&
                "$APP_STACK_STATE" != "disabled" ]]; then
            echo "ERROR: Invalid AppStack.State: $APP_STACK_STATE"
            echo "Expected: enabled or disabled"
            exit 1
          fi

          if [[ "$ROOT_STACK_STATE" != "enabled" &&
                "$ROOT_STACK_STATE" != "disabled" ]]; then
            echo "ERROR: Invalid RootStack.State: $ROOT_STACK_STATE"
            echo "Expected: enabled or disabled"
            exit 1
          fi

          if [[ "$APP_STACK_STATE" == "enabled" &&
                "$ROOT_STACK_STATE" == "enabled" ]]; then
            echo "Deployment is enabled."
            echo "deployment-enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Deployment is disabled."
            echo "deployment-enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add deployment guard summary
        if: always()
        run: |
          {
            echo "## Deployment Guard"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Environment | \`${{ inputs.environment }}\` |"
            echo "| AppStack.State | \`${{ steps.guard.outputs.app-stack-state || 'unknown' }}\` |"
            echo "| RootStack.State | \`${{ steps.guard.outputs.root-stack-state || 'unknown' }}\` |"
            echo "| Deployment | \`${{ steps.guard.outputs.deployment-enabled == 'true' && 'enabled' || 'disabled' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"