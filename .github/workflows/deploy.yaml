name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub deployment environment
        required: true
        type: string
      database-enabled:
        description: Whether the service uses a database
        required: false
        type: boolean
        default: false
      env-params-file:
        description: Path to the ECS parameters file
        required: true
        type: string
      image-tag:
        description: Image tag to deploy
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ENV_PARAMS_FILE: ${{ inputs.env-params-file }}
  IMAGE_TAG: ${{ inputs.image-tag }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4.48.2

      - name: Load service configuration
        run: |
          echo "ENVIRONMENT_NAME=$(yq -r '.project.environment' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=$(yq -r '.project.name' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"
          echo "SERVICE_NAME=$(yq -r '.service.name' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY_NAME=$(yq -r '.image.repository' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY_NAMESPACE=$(yq -r '.image.nameSpace' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"

          echo "SERVICE_STACK_NAME=$(yq -r '.project.name' $ENV_PARAMS_FILE)-$(yq -r '.project.environment' $ENV_PARAMS_FILE)-$(yq -r '.service.name' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY_FULL_NAME=$(yq -r '.image.nameSpace' $ENV_PARAMS_FILE)/$(yq -r '.image.repository' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"

          echo "CONTAINER_PORT=$(yq -r '.container.port' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"
          echo "SIZE=$(yq -r '.container.size' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"

          echo "DESIRED_COUNT=$(yq -r '.deployment.desiredCount' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"

          echo "PATH_PATTERN=$(yq -r '.loadBalancer.pathPattern' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"
          echo "LISTENER_PRIORITY=$(yq -r '.loadBalancer.listenerRulePriority' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"
          echo "HEALTH_CHECK_PATH=$(yq -r '.loadBalancer.healthCheckPath' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"

          echo "CUSTOMER_API_URL=$(yq -r '.upstream.customerApiUrl // ""' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"
          echo "TASK_API_URL=$(yq -r '.upstream.taskApiUrl // ""' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"
          echo "BILLING_API_URL=$(yq -r '.upstream.billingApiUrl // ""' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"

          echo "CORS_ALLOW_ORIGINS=$(yq -r '.frontend.corsAllowOrigins // ""' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"
      
      - name: Load database configuration
        if: inputs.database-enabled
        run: |
          echo "ROOT_STACK=$(yq -r '.project.name' $ENV_PARAMS_FILE)-$(yq -r '.project.environment' $ENV_PARAMS_FILE)-root-stack" >> "$GITHUB_ENV"

          echo "DATABASE_ENABLED=$(yq -r '.database.enabled' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"
          echo "DATABASE_HOST_CONFIG=$(yq -r '.database.endpoint' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"
          echo "DATABASE_PORT_CONFIG=$(yq -r '.database.port' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"
          echo "DATABASE_NAME=$(yq -r '.database.name' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: SparrowX-ECS/ecs-infrastructure
          ref: main
          path: ecs-infrastructure

      - name: Resolve database configuration
        if: inputs.database-enabled
        run: |
          echo "Resolving database outputs from root stack: $ROOT_STACK"

          # ------------------------------------------------------------
          # Discover the PostgreSQL nested stack from the root stack
          # ------------------------------------------------------------
          POSTGRES_STACK="$(
            aws cloudformation list-stack-resources \
              --region "$AWS_REGION" \
              --stack-name "$ROOT_STACK" \
              --query "StackResourceSummaries[?LogicalResourceId=='RDSPostgresDBs' && ResourceType=='AWS::CloudFormation::Stack'].PhysicalResourceId | [0]" \
              --output text
          )"

          if [ -z "$POSTGRES_STACK" ] || [ "$POSTGRES_STACK" = "None" ]; then
            echo "ERROR: Could not find RDSPostgresDBs nested stack under $ROOT_STACK"
            exit 1
          fi

          echo "Discovered PostgreSQL nested stack: $POSTGRES_STACK"

          # ------------------------------------------------------------
          # Read outputs from the PostgreSQL nested stack
          # ------------------------------------------------------------
          stack_output() {
            aws cloudformation describe-stacks \
              --region "$AWS_REGION" \
              --stack-name "$POSTGRES_STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }

          DATABASE_HOST="$DATABASE_HOST_CONFIG"
          DATABASE_PORT="$DATABASE_PORT_CONFIG"

          [ -n "$DATABASE_HOST" ] || \
            DATABASE_HOST="$(stack_output "${DATABASE_NAME}DatabaseEndpoint")"

          [ -n "$DATABASE_PORT" ] || \
            DATABASE_PORT="$(stack_output "${DATABASE_NAME}DatabasePort")"

          DATABASE_SECRET_ARN="$(stack_output "${DATABASE_NAME}DatabaseSecretArn")"
          DATABASE_SECURITY_GROUP_ID="$(stack_output "${DATABASE_NAME}DatabaseSecurityGroupId")"

          # ------------------------------------------------------------
          # Validate resolved configuration
          # ------------------------------------------------------------
          if [ -z "$DATABASE_HOST" ] || [ "$DATABASE_HOST" = "None" ]; then
            echo "ERROR: Could not resolve database endpoint for $DATABASE_NAME"
            exit 1
          fi

          if [ -z "$DATABASE_PORT" ] || [ "$DATABASE_PORT" = "None" ]; then
            echo "ERROR: Could not resolve database port for $DATABASE_NAME"
            exit 1
          fi

          if [ -z "$DATABASE_SECRET_ARN" ] || [ "$DATABASE_SECRET_ARN" = "None" ]; then
            echo "ERROR: Could not resolve database secret ARN for $DATABASE_NAME"
            exit 1
          fi

          if [ -z "$DATABASE_SECURITY_GROUP_ID" ] || [ "$DATABASE_SECURITY_GROUP_ID" = "None" ]; then
            echo "ERROR: Could not resolve database security group ID for $DATABASE_NAME"
            exit 1
          fi

          {
            echo "DATABASE_HOST=$DATABASE_HOST"
            echo "DATABASE_PORT=$DATABASE_PORT"
            echo "DATABASE_SECRET_ARN=$DATABASE_SECRET_ARN"
            echo "DATABASE_SECURITY_GROUP_ID=$DATABASE_SECURITY_GROUP_ID"
          } >> "$GITHUB_ENV"

          echo "Database configuration resolved successfully."
          echo "DATABASE_HOST=$DATABASE_HOST"
          echo "DATABASE_PORT=$DATABASE_PORT"
          echo "DATABASE_SECRET_ARN=$DATABASE_SECRET_ARN"
          echo "DATABASE_SECURITY_GROUP_ID=$DATABASE_SECURITY_GROUP_ID"

      - name: Cleanup stale CloudFormation stack
        run: |
          echo "Checking CloudFormation stack: $SERVICE_STACK_NAME"

          STACK_STATUS="$(
            aws cloudformation describe-stacks \
              --region "$AWS_REGION" \
              --stack-name "$SERVICE_STACK_NAME" \
              --query 'Stacks[0].StackStatus' \
              --output text 2>/dev/null || true
          )"

          if [ -z "$STACK_STATUS" ] || [ "$STACK_STATUS" = "None" ]; then
            echo "Stack does not exist. Nothing to clean up."
            exit 0
          fi

          echo "Current stack status: $STACK_STATUS"

          case "$STACK_STATUS" in
            ROLLBACK_COMPLETE|DELETE_COMPLETE|UPDATE_ROLLBACK_COMPLETE)
              echo "Stack is in a terminal state that may prevent deployment."
              echo "Deleting stale stack: $SERVICE_STACK_NAME"

              aws cloudformation delete-stack \
                --region "$AWS_REGION" \
                --stack-name "$SERVICE_STACK_NAME"

              echo "Waiting for stack deletion..."

              aws cloudformation wait stack-delete-complete \
                --region "$AWS_REGION" \
                --stack-name "$SERVICE_STACK_NAME"

              echo "Stack deleted successfully."
              ;;

            CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE_CLEANUP_IN_PROGRESS)
              echo "Stack is usable. No cleanup required."
              ;;

            *)
              echo "Stack is currently in state: $STACK_STATUS"
              echo "No automatic deletion will be performed."
              ;;
          esac

      - name: Deploy ECS service
        run: |
          parameters=(
            "EnvironmentName=$ENVIRONMENT_NAME"
            "ServiceName=$SERVICE_NAME"
            "ECRRepoFullName=$ECR_REPOSITORY_FULL_NAME"
            "ImageTag=$IMAGE_TAG"
            "ContainerPort=$CONTAINER_PORT"
            "Size=$SIZE"
            "DesiredCount=$DESIRED_COUNT"
            "PathPattern=$PATH_PATTERN"
            "ListenerRulePriority=$LISTENER_PRIORITY"
            "HealthCheckPath=$HEALTH_CHECK_PATH"
          )

          if [[ -n "$CUSTOMER_API_URL" ]]; then
            parameters+=("CustomerApiUrl=$CUSTOMER_API_URL")
          fi

          if [[ -n "$TASK_API_URL" ]]; then
            parameters+=("TaskApiUrl=$TASK_API_URL")
          fi

          if [[ -n "$BILLING_API_URL" ]]; then
            parameters+=("BillingApiUrl=$BILLING_API_URL")
          fi

          if [[ -n "$CORS_ALLOW_ORIGINS" ]]; then
            parameters+=("CorsAllowOrigins=$CORS_ALLOW_ORIGINS")
          fi

          if [ "$DATABASE_ENABLED" = true ]; then
            parameters+=(
              "DatabaseSecretArn=$DATABASE_SECRET_ARN"
              "DatabaseSecurityGroupId=$DATABASE_SECURITY_GROUP_ID"
              "DatabaseHost=$DATABASE_HOST"
              "DatabasePort=$DATABASE_PORT"
              "DatabaseName=$DATABASE_NAME"
            )
          fi

          echo "Deploying stack: $SERVICE_STACK_NAME"
          echo "Service: $SERVICE_NAME"
          echo "ECRRepo: $ECR_REPOSITORY_FULL_NAME"
          echo "Image update: ${{ inputs.update-image }}"
          echo "Database enabled: ${{ inputs.database-enabled }}"

          aws cloudformation deploy \
            --template-file ecs-infrastructure/cloudformation/service.yaml \
            --stack-name "$SERVICE_STACK_NAME" \
            --parameter-overrides "${parameters[@]}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region "$AWS_REGION"

      - name: Add deployment summary
        if: always()
        run: |
          {
            echo "## ECS deployment"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Service | \`$SERVICE_NAME\` |"
            echo "| Stack | \`$SERVICE_STACK_NAME\` |"
            echo "| Environment | \`$ENVIRONMENT_NAME\` |"
            echo "| ECR repository | \`$ECR_REPOSITORY_FULL_NAME\` |"
            echo "| Image tag | \`$IMAGE_TAG\` |"
            echo "| Database enabled | \`${{ inputs.database-enabled }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show stack outputs
        if: success()
        run: |
          echo "## CloudFormation stack outputs"
          aws cloudformation describe-stacks \
            --stack-name "$SERVICE_STACK_NAME" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table

      - name: Show stack events on failure
        if: failure()
        run: |
          echo "## Recent CloudFormation stack events"

          aws cloudformation describe-stack-events \
            --stack-name "$SERVICE_STACK_NAME" \
            --query 'StackEvents[:20].[Timestamp,ResourceStatus,LogicalResourceId,ResourceStatusReason]' \
            --output table