name: Copy Image

on:
  workflow_call:
    inputs:
      source-image-tag:
        description: Source Image Tag To Copy
        required: false
        type: string
        default: "dev-deployed"

      target-image-tag:
        description: Target Image Tag After Copied
        required: false
        type: string
        default: "prod-candidate"

      source-env-params-file:
        description: Path to Helm Values file for the source environment
        required: true
        type: string

      target-env-params-file:
        description: Path to Helm Values file for the target environment
        required: true
        type: string

    
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  SOURCE_ENV_PARAMS_FILE: ${{ inputs.source-env-params-file }}
  TARGET_ENV_PARAMS_FILE: ${{ inputs.target-env-params-file }}
  SOURCE_IMAGE_TAG: ${{ inputs.source-image-tag }}
  TARGET_IMAGE_TAG: ${{ inputs.target-image-tag }}

jobs:
  copy-image:
    name: Copy Image to Target ECR
    runs-on: ubuntu-latest

    steps:

      - name: Checkout application
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4.48.2

      - name: Load ECR repositories
        run: |
          SOURCE_ECR_REPOSITORY="$(
            yq -r '.projectName' "$SOURCE_ENV_PARAMS_FILE"
          )/$(
            yq -r '.environment' "$SOURCE_ENV_PARAMS_FILE"
          )"/$(
            yq -r '.serviceName' "$SOURCE_ENV_PARAMS_FILE"
          )"

          TARGET_ECR_REPOSITORY="$(
            yq -r '.projectName' "$TARGET_ENV_PARAMS_FILE"
          )/$(
            yq -r '.environment' "$TARGET_ENV_PARAMS_FILE"
          )"/$(
            yq -r '.serviceName' "$TARGET_ENV_PARAMS_FILE"
          )"

          if [ -z "$SOURCE_ECR_REPOSITORY" ] || [ "$SOURCE_ECR_REPOSITORY" = "null/null" ]; then
            echo "ERROR: Source ECR repository could not be resolved."
            exit 1
          fi

          if [ -z "$TARGET_ECR_REPOSITORY" ] || [ "$TARGET_ECR_REPOSITORY" = "null/null" ]; then
            echo "ERROR: Target ECR repository could not be resolved."
            exit 1
          fi

          echo "SOURCE_ECR_REPOSITORY=$SOURCE_ECR_REPOSITORY" >> "$GITHUB_ENV"
          echo "TARGET_ECR_REPOSITORY=$TARGET_ECR_REPOSITORY" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure target repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names "$TARGET_ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            > /dev/null

          echo "Target ECR repository exists."

      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

          skopeo --version


      - name: Install ORAS
        uses: oras-project/setup-oras@v2
        with:
          version: 1.3.4

      - name: Verify ORAS
        run: oras version

      - name: Login to ECR
        run: |
          ECR_REGISTRY="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          ECR_PASSWORD="$(aws ecr get-login-password --region "$AWS_REGION")"

          # Skopeo and ORAS use different credential stores by default.
          printf '%s' "$ECR_PASSWORD" |
            skopeo login \
              --username AWS \
              --password-stdin \
              "$ECR_REGISTRY"

          printf '%s' "$ECR_PASSWORD" |
            oras login \
              --username AWS \
              --password-stdin \
              "$ECR_REGISTRY"

      - name: Resolve Source Image Tag
        run: |
          IMAGE_DETAILS=$(aws ecr describe-images \
            --repository-name "$SOURCE_ECR_REPOSITORY" \
            --image-ids "imageTag=$SOURCE_IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query "imageDetails[0].[imageDigest, imageTags[?@!='$SOURCE_IMAGE_TAG'] | [0]]" \
            --output text)

          SOURCE_IMAGE_DIGEST=$(awk '{print $1}' <<< "$IMAGE_DETAILS")
          GIT_SHA_IMAGE_TAG=$(awk '{print $2}' <<< "$IMAGE_DETAILS")

          if [[ -z "$SOURCE_IMAGE_DIGEST" || "$SOURCE_IMAGE_DIGEST" == "None" ]]; then
            echo "::error::Could not resolve source image tag: $SOURCE_IMAGE_TAG"
            exit 1
          fi

          if [[ -z "$GIT_SHA_IMAGE_TAG" || "$GIT_SHA_IMAGE_TAG" == "None" ]]; then
            echo "::error::No Git SHA tag found for source image digest $SOURCE_IMAGE_DIGEST"
            exit 1
          fi

          echo "SOURCE_IMAGE_DIGEST=$SOURCE_IMAGE_DIGEST" >> "$GITHUB_ENV"
          echo "GIT_SHA_IMAGE_TAG=$GIT_SHA_IMAGE_TAG" >> "$GITHUB_ENV"

          echo "Source image digest: $SOURCE_IMAGE_DIGEST"
          echo "Original Git SHA tag: $GIT_SHA_IMAGE_TAG"

      # Copy Image with origin git-sha-image-tag       
      - name: Copy image to target ECR
        run: |
          ECR_REGISTRY="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          SOURCE_IMAGE="docker://$ECR_REGISTRY/$SOURCE_ECR_REPOSITORY@$SOURCE_IMAGE_DIGEST"
          TARGET_IMAGE="docker://$ECR_REGISTRY/$TARGET_ECR_REPOSITORY:$GIT_SHA_IMAGE_TAG"

          echo "Copying image..."
          echo "Source: $SOURCE_ECR_REPOSITORY@$SOURCE_IMAGE_DIGEST"
          echo "Target: $TARGET_ECR_REPOSITORY:$GIT_SHA_IMAGE_TAG"

          skopeo copy \
            --all \
            "$SOURCE_IMAGE" \
            "$TARGET_IMAGE"

          echo "Image copied successfully."

      # Cleanu-up target-image-tag that's already in use, to assign it to a new image
      - name: Cleanup previous target image tag
        run: |
          set +e
          describe_output=$(aws ecr describe-images \
            --repository-name "$TARGET_ECR_REPOSITORY" \
            --image-ids "imageTag=$TARGET_IMAGE_TAG" \
            --region "$AWS_REGION" 2>&1)
          describe_status=$?
          set -e

          if [ "$describe_status" -eq 0 ]; then
            echo "Image tag exists. Deleting it..."

            aws ecr batch-delete-image \
              --repository-name "$TARGET_ECR_REPOSITORY" \
              --image-ids "imageTag=$TARGET_IMAGE_TAG" \
              --region "$AWS_REGION"

            echo "Target Image tag cleaned successfully."
          elif grep -q "ImageNotFoundException" <<< "$describe_output"; then
            echo "Image tag does not exist; proceeding..."
          else
            echo "$describe_output"
            exit "$describe_status"
          fi

      # Attach target-image-tag to the copied image
      - name: Add target image tag to target image
        run: |
          IMAGE_MANIFEST=$(aws ecr batch-get-image \
            --repository-name "$TARGET_ECR_REPOSITORY" \
            --image-ids "imageTag=$GIT_SHA_IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'images[0].imageManifest' \
            --output text)

          IMAGE_MANIFEST_MEDIA_TYPE=$(aws ecr batch-get-image \
            --repository-name "$TARGET_ECR_REPOSITORY" \
            --image-ids "imageTag=$GIT_SHA_IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'images[0].imageManifestMediaType' \
            --output text)

          aws ecr put-image \
            --repository-name "$TARGET_ECR_REPOSITORY" \
            --image-tag "$TARGET_IMAGE_TAG" \
            --image-manifest "$IMAGE_MANIFEST" \
            --image-manifest-media-type "$IMAGE_MANIFEST_MEDIA_TYPE" \
            --region "$AWS_REGION"

          echo "Added target image tag to copied image."

      - name: Verify copied image
        run: |
          echo "Verifying copied image in target ECR..."

          TARGET_DIGEST="$(aws ecr describe-images \
            --repository-name "$TARGET_ECR_REPOSITORY" \
            --image-ids "imageTag=$TARGET_IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          if [ -z "$TARGET_DIGEST" ] || [ "$TARGET_DIGEST" = "None" ]; then
            echo "Target image tag '$TARGET_IMAGE_TAG' was not found after image copy."
            exit 1
          fi

          if [ "$TARGET_DIGEST" != "$SOURCE_IMAGE_DIGEST" ]; then
            echo "Target image digest does not match the expected source digest."
            echo "Expected: $SOURCE_IMAGE_DIGEST"
            echo "Target:   $TARGET_DIGEST"
            exit 1
          fi

          echo "TARGET_DIGEST=$TARGET_DIGEST" >> "$GITHUB_ENV"

          echo "Image copied successfully."

      - name: Copy image signature
        run: |
          ECR_REGISTRY="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          SOURCE_IMAGE="$ECR_REGISTRY/$SOURCE_ECR_REPOSITORY@$SOURCE_IMAGE_DIGEST"
          TARGET_IMAGE="$ECR_REGISTRY/$TARGET_ECR_REPOSITORY@$TARGET_DIGEST"

          echo "Inspecting signature referrers for: $TARGET_IMAGE"

          DISCOVER_OUTPUT="$(oras discover \
            --format json \
            "$TARGET_IMAGE")"

          if jq -e \
            'any(.manifests[]?; .artifactType == "application/vnd.dev.cosign.artifact.sig.v1+json")' \
            <<< "$DISCOVER_OUTPUT" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Cosign signature already exists; skipping signature copy."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Cosign signature doesn't exist in target repo; it will be copied."

            echo "Copying Cosign signature..."
            echo "Source: $SOURCE_IMAGE"
            echo "Target: $TARGET_IMAGE"

            oras discover "$SOURCE_IMAGE"

            # Copy the Cosign signature/referrers from source to target.
            oras cp \
              "$SOURCE_IMAGE" \
              "$TARGET_IMAGE" \
              --recursive

            echo "Cosign signature copied successfully."
          fi
          
      - name: Add promotion summary
        if: always()
        run: |
          {
            echo "## ECR Image Promotion"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Source repository | \`$SOURCE_ECR_REPOSITORY\` |"
            echo "| Target repository | \`$TARGET_ECR_REPOSITORY\` |"
            echo "| Image tag | \`$SOURCE_IMAGE_TAG\` |"
            echo "| Image digest | \`$TARGET_DIGEST\` |"
            echo "| Result | \`${{ job.status }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
