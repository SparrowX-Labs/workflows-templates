name: Verify Image Signature

on:
  workflow_call:
    inputs:
      env-params-file:
        description: Application environment values file containing projectName, environment, and serviceName
        required: true
        type: string
      image-tag:
        description: ECR image tag to resolve and verify
        required: true
        type: string
      certificate-identity-regexp:
        description: Expected Sigstore certificate identity regular expression
        required: false
        default: '^https://github\.com/SparrowX-Labs/workflows-templates/\.github/workflows/sign-image\.yaml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'
        type: string
      certificate-oidc-issuer:
        description: Expected OIDC issuer in the signing certificate
        required: false
        default: https://token.actions.githubusercontent.com
        type: string
    outputs:
      status:
        description: Image signature verification status
        value: ${{ jobs.verify-image-signature.outputs.status }}

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ENV_PARAMS_FILE: ${{ inputs.env-params-file }}
  IMAGE_TAG: ${{ inputs.image-tag }}

jobs:
  verify-image-signature:
    name: Verify Image Signature
    runs-on: ubuntu-latest

    outputs:
      status: ${{ steps.summary.outputs.status }}

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4.48.2

      - name: Load image configuration
        run: |
          echo "ECR_REPOSITORY_FULL_NAME=$(yq -r '.projectName' "$ENV_PARAMS_FILE")/$(yq -r '.environment' "$ENV_PARAMS_FILE")/$(yq -r '.serviceName' "$ENV_PARAMS_FILE")" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag
        run: |
          set -euo pipefail

          IMAGE_DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY_FULL_NAME" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Could not resolve a valid digest for image tag '$IMAGE_TAG': $IMAGE_DIGEST"
            exit 1
          fi

          echo "IMAGE_URI=${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY_FULL_NAME@$IMAGE_DIGEST" >> "$GITHUB_ENV"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Verify image signature
        id: verify
        continue-on-error: true
        env:
          CERTIFICATE_IDENTITY_REGEXP: ${{ inputs.certificate-identity-regexp }}
          CERTIFICATE_OIDC_ISSUER: ${{ inputs.certificate-oidc-issuer }}
        run: |
          case "$IMAGE_URI" in
            *@sha256:*) ;;
            *)
              echo "Resolved image URI must use registry/repository@sha256:digest format."
              exit 1
              ;;
          esac

          cosign verify "$IMAGE_URI" \
            --certificate-identity-regexp "$CERTIFICATE_IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER"

      - name: Add verification summary
        id: summary
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          IMAGE_URI: ${{ env.IMAGE_URI }}
        run: |
          STATUS=failed
          if [ "$VERIFY_OUTCOME" = success ]; then
            STATUS=passed
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          {
            echo "## Image Signature Verification"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Tool | Cosign |"
            echo "| Image tag | $IMAGE_TAG |"
            echo "| Image | $IMAGE_URI |"
            echo "| Certificate identity | ${{ inputs.certificate-identity-regexp }} |"
            echo "| OIDC issuer | ${{ inputs.certificate-oidc-issuer }} |"
            echo "| Result | **$STATUS** |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" = failed ]; then
            exit 1
          fi
