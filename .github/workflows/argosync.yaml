name: Argo CD Sync

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: string

      env-params-file:
        description: Helm values file for the target environment
        required: true
        type: string

      image-tag:
        description: Image tag to deploy
        required: true
        type: string

    secrets:
      ARGOCD_SERVER:
        required: true
      ARGOCD_AUTH_TOKEN:
        required: true

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ENV_PARAMS_FILE: ${{ inputs.env-params-file }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  argosync:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      REPO_NAME: ${{ github.event.repository.name }}
      ENVIRONMENT: ${{ inputs.environment }}
      ENV_PARAMS_FILE: ${{ inputs.env-params-file }}
      IMAGE_TAG: ${{ inputs.image-tag }}

    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          case "$IMAGE_TAG" in
            dev-candidate|dev-deployed|prod-candidate|prod-deployed|prod-previous)
              ;;
            *)
              echo "::error::Invalid image tag: $IMAGE_TAG"
              exit 1
              ;;
          esac

          APP_NAME="${REPO_NAME}-${ENVIRONMENT}"

          echo "Application Name: $REPO_NAME"
          echo "ArgoApp Name: $APP_NAME"
          echo "Environment: $ENVIRONMENT"
          echo "Values file: $ENV_PARAMS_FILE"
          echo "Image tag: $IMAGE_TAG"

          echo APP_NAME="$APP_NAME" >> "$GITHUB_ENV"


      - name: Checkout application
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4.48.2

      - name: Load image configuration
        run: |
          echo "ECR_REPOSITORY_FULL_NAME=$(yq -r '.projectName' $ENV_PARAMS_FILE)/$(yq -r '.environment' $ENV_PARAMS_FILE)/$(yq -r '.serviceName' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"
          echo "ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_ENV"
          
      - name: Verify Argo CD access
        uses: clowdhaus/argo-cd-action@v4.2.0
        with:
          version: 2.14.11
          command: app get ${{ env.APP_NAME }}
          options: >-
            --server ${{ secrets.ARGOCD_SERVER }}
            --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }}
            --grpc-web

      - name: Wait for any active sync operation
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..120}; do
            phase="$(argocd app get "$APP_NAME" \
              --server "$ARGOCD_SERVER" \
              --auth-token "$ARGOCD_AUTH_TOKEN" \
              --grpc-web \
              -o json | jq -r '.status.operationState.phase // "Idle"')"

            if [[ "$phase" != "Running" ]]; then
              echo "No active operation (last phase: $phase)"
              exit 0
            fi

            echo "An Argo CD operation is already running; waiting 5 seconds (attempt $attempt/120)"
            sleep 5
          done

          echo "Timed out waiting for the existing Argo CD operation"
          exit 1

      - name: Set image tag
        uses: clowdhaus/argo-cd-action@v4.2.0 
        with:
          version: 2.14.11
          command: app set ${{ env.APP_NAME }}
          options: >-
            --server ${{ secrets.ARGOCD_SERVER }}
            --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }}
            --grpc-web
            --source-position 1
            --helm-set-string image.repository=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_FULL_NAME }}
            --helm-set-string image.tag=${{ env.IMAGE_TAG }}


      - name: Sync application with retry
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..12}; do
            set +e
            output="$(argocd app sync "$APP_NAME" \
              --server "$ARGOCD_SERVER" \
              --auth-token "$ARGOCD_AUTH_TOKEN" \
              --grpc-web \
              --timeout 600 2>&1)"
            status=$?
            set -e

            echo "$output"

            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi

            if grep -Eiq 'another operation is already in progress|operation.*in progress' <<< "$output"; then
              echo "Argo CD is busy; waiting 10 seconds before retry $attempt/12"
              sleep 10
              continue
            fi

            exit "$status"
          done

          echo "Timed out retrying Argo CD sync"
          exit 1

      - name: Wait for application health
        uses: clowdhaus/argo-cd-action@v4.2.0
        with:
          version: 2.14.11
          command: app wait ${{ env.APP_NAME }}
          options: >-
            --server ${{ secrets.ARGOCD_SERVER }}
            --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }}
            --grpc-web
            --sync
            --health
            --timeout 600
